<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>networKING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: 'Cormorant Garamond', serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  /* ============ SLIDES ============ */
  .slide {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100dvh;
    opacity: 0;
    visibility: hidden;
    z-index: 1;
    overflow: hidden;
    perspective: 1200px;
    background: #050505;
    -webkit-filter: blur(0px);
    filter: blur(0px);
    transition:
      opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1),
      -webkit-filter 1.4s cubic-bezier(0.4, 0, 0.2, 1),
      filter 1.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .slide.active {
    opacity: 1;
    visibility: visible;
    z-index: 2;
    -webkit-filter: blur(0px);
    filter: blur(0px);
  }
  /* Blur-dissolve: incoming starts soft, outgoing softens away */
  .slide.entering {
    -webkit-filter: blur(10px);
    filter: blur(10px);
  }
  .slide.exiting {
    opacity: 0;
    -webkit-filter: blur(10px);
    filter: blur(10px);
  }
  @media (max-width: 900px) {
    .slide.entering, .slide.exiting {
      -webkit-filter: blur(6px);
      filter: blur(6px);
    }
  }

  /* Wrapper that carries the Ken Burns motion */
  .kb {
    position: absolute;
    inset: 0;
    will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }

  /* 3D tilt layer — receives gyro / mouse rotation */
  .tilt3d {
    position: absolute;
    inset: -8%;
    will-change: transform;
    transform: perspective(1100px) rotateX(0deg) rotateY(0deg) scale(1.06);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    -webkit-transform: translateZ(0);
  }

  .slide img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Foreground — the actual art (contain on phone so it never crops badly) */
  .slide img.fg {
    object-fit: cover;
    object-position: center;
    z-index: 2;
  }

  /* Blurred backdrop that fills the box on mobile */
  .slide img.bg {
    object-fit: cover;
    object-position: center;
    filter: blur(24px) brightness(0.45) saturate(1.35);
    transform: scale(1.3);
    z-index: 1;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }

  @media (max-width: 900px) {
    .slide img.fg { object-fit: contain; padding: 0; }
    .slide img.bg { filter: blur(14px) brightness(0.5) saturate(1.35); }
  }

  /* ============ KEN BURNS KEYS (randomised) ============ */
  @keyframes kb1 { from { transform: scale(1.00); transform-origin: 50% 50%; } to { transform: scale(1.14); transform-origin: 30% 40%; } }
  @keyframes kb2 { from { transform: scale(1.14); transform-origin: 70% 30%; } to { transform: scale(1.00); transform-origin: 50% 50%; } }
  @keyframes kb3 { from { transform: scale(1.02); transform-origin: 20% 70%; } to { transform: scale(1.16); transform-origin: 60% 30%; } }
  @keyframes kb4 { from { transform: scale(1.15); transform-origin: 80% 20%; } to { transform: scale(1.02); transform-origin: 40% 70%; } }
  @keyframes kb5 { from { transform: scale(1.06); transform-origin: 45% 60%; } to { transform: scale(1.12); transform-origin: 75% 45%; } }

  /* ============ COLOR FLUSH (color-matched crossfade) ============ */
  .flush {
    position: fixed; inset: 0;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    background: rgb(0, 0, 0);
    transition: opacity 0.9s ease-out;
  }

  /* ============ AMBIENT OVERLAYS ============ */
  .atmosphere {
    position: fixed; inset: 0;
    z-index: 10; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.55) 100%);
    animation: atmos 9s ease-in-out infinite alternate;
  }
  @keyframes atmos { from { opacity: 0.5; } to { opacity: 1; } }

  .grain {
    position: fixed; inset: -60%;
    z-index: 11; pointer-events: none;
    opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    animation: grainShift 0.4s steps(1) infinite;
  }
  @keyframes grainShift {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-4%, 4%); }
    50%  { transform: translate(3%, -3%); }
    75%  { transform: translate(-2%, 2%); }
    100% { transform: translate(0, 0); }
  }

  /* ============ PROGRESS BAR ============ */
  .progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    width: 0%;
    z-index: 40;
    background: linear-gradient(90deg, #e8c37e, #f7e8c3, #e8c37e);
    box-shadow: 0 0 12px rgba(232, 195, 126, 0.6);
    border-radius: 0 3px 3px 0;
  }

  /* ============ DOTS ============ */
  .dots {
    position: fixed;
    bottom: 56px; left: 0; right: 0;
    z-index: 40;
    display: flex;
    justify-content: center;
    gap: 9px;
    pointer-events: none;
  }
  .dots i {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.28);
    transition: all 0.6s ease;
    box-shadow: 0 0 6px rgba(0,0,0,0.5);
  }
  .dots i.on {
    width: 24px;
    border-radius: 4px;
    background: linear-gradient(90deg, #e8c37e, #f7e8c3);
    box-shadow: 0 0 10px rgba(232, 195, 126, 0.55);
  }

  /* ============ GLASSY FOOTER ============ */
  .footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 30;
    text-align: center;
    padding: 42px 16px 18px;
    pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,0.78) 4%, rgba(0,0,0,0.35) 45%, transparent 100%);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .footer .brand {
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 9px;
    text-transform: uppercase;
    color: transparent;
    background: linear-gradient(100deg, #b8914f 5%, #f1dcae 35%, #e8c37e 55%, #b8914f 90%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    animation: shimmer 5s linear infinite;
    font-style: italic;
  }
  .footer .tagline {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    font-weight: 300;
  }
  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  /* ============ TOUCH ============ */
  .tap-zone {
    position: fixed; inset: 0;
    z-index: 5;
    cursor: pointer;
  }

  /* ============ PRELOADER ============ */
  .preloader {
    position: fixed; inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    background: #000;
    transition: opacity 0.8s ease;
  }
  .preloader.done { opacity: 0; pointer-events: none; }
  .preloader .bar {
    width: 140px; height: 2px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
    border-radius: 2px;
  }
  .preloader .bar i {
    display: block;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, #b8914f, #f7e8c3);
    animation: load 1.1s ease-in-out infinite;
  }
  @keyframes load { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .preloader .word {
    font-size: 15px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    font-style: italic;
    font-weight: 300;
    animation: breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 0.35; } 50% { opacity: 0.9; } }

  @media (max-width: 768px) {
    .footer .brand { font-size: 16px; letter-spacing: 7px; }
    .footer .tagline { font-size: 10px; letter-spacing: 3px; }
    .dots { bottom: 54px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="slide active" data-idx="0">
    <div class="tilt3d"><div class="kb"><img class="bg" src="images/1.jpg" alt=""><img class="fg" src="images/1.jpg" alt=""></div></div>
  </div>
  <div class="slide" data-idx="1">
    <div class="tilt3d"><div class="kb"><img class="bg" src="images/2.jpg" alt=""><img class="fg" src="images/2.jpg" alt=""></div></div>
  </div>
  <div class="slide" data-idx="2">
    <div class="tilt3d"><div class="kb"><img class="bg" src="images/3.jpg" alt=""><img class="fg" src="images/3.jpg" alt=""></div></div>
  </div>
  <div class="slide" data-idx="3">
    <div class="tilt3d"><div class="kb"><img class="bg" src="images/4.jpg" alt=""><img class="fg" src="images/4.jpg" alt=""></div></div>
  </div>
  <div class="slide" data-idx="4">
    <div class="tilt3d"><div class="kb"><img class="bg" src="images/5.jpg" alt=""><img class="fg" src="images/5.jpg" alt=""></div></div>
  </div>
</div>

<div class="atmosphere"></div>
<div class="grain"></div>
<div class="flush" id="flush"></div>

<div class="progress" id="progress"></div>

<div class="dots" id="dots"></div>

<div class="footer">
  <div class="brand">networKING</div>
  <div class="tagline">Art + Intelligence</div>
</div>

<div class="tap-zone" id="tapZone"></div>

<div class="preloader" id="preloader">
  <div class="word">networKING</div>
  <div class="bar"><i></i></div>
</div>

<script>
(function() {
  var SLIDES = document.querySelectorAll('.slide');
  var TOTAL = SLIDES.length;
  var KBS = ['kb1', 'kb2', 'kb3', 'kb4', 'kb5'];
  var tapZone = document.getElementById('tapZone');
  var progress = document.getElementById('progress');
  var preloader = document.getElementById('preloader');
  var dotsBox = document.getElementById('dots');
  var flush = document.getElementById('flush');

  /* Dominant colour per slide for the colour-matched crossfade */
  var palettes = new Array(TOTAL).fill('0,0,0');

  function getPalette(img, idx) {
    try {
      var c = document.createElement('canvas');
      c.width = 9; c.height = 9;
      var ctx = c.getContext('2d');
      if (!ctx) return;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, 0, 0, 9, 9);
      var d = ctx.getImageData(0, 0, 9, 9).data;
      var r = 0, g = 0, b = 0, n = 0;
      for (var i = 0; i < d.length; i += 4) {
        var sat = Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]);
        var w = 0.45 + sat / 255;
        r += d[i] * w; g += d[i + 1] * w; b += d[i + 2] * w; n += w;
      }
      palettes[idx] = Math.round(r / n) + ',' + Math.round(g / n) + ',' + Math.round(b / n);
    } catch (err) {}
  }

  /* Build dots */
  for (var d = 0; d < TOTAL; d++) {
    var dot = document.createElement('i');
    dotsBox.appendChild(dot);
  }

  /* ============ PRELOAD: wait on the real DOM images ============ */
  var allImgs = [];
  SLIDES.forEach(function(slide) {
    slide.querySelectorAll('img').forEach(function(img) {
      allImgs.push(img);
    });
  });

  function readyToStart() {
    var ok = true;
    allImgs.forEach(function(img) {
      if (!(img.complete && img.naturalWidth > 0)) ok = false;
    });
    return ok;
  }

  function waitForImages(cb) {
    if (readyToStart()) { cb(); return; }
    var pending = 0;
    function onLoad() {
      pending--;
      if (pending <= 0) cb();
    }
    allImgs.forEach(function(img) {
      if (img.complete && img.naturalWidth > 0) return;
      pending++;
      img.onload = onLoad;
      img.onerror = onLoad;
    });
    if (pending === 0) cb();
  }

  waitForImages(function() {
    /* Force full decode where supported so slides never flash black */
    if (allImgs[0] && allImgs[0].decode) {
      Promise.all(allImgs.map(function(img) {
        return img.decode().catch(function() {});
      })).then(function() {
        /* Sample each image's dominant colour for the match-fade */
        SLIDES.forEach(function(slide, i) {
          getPalette(slide.querySelector('img.fg'), i);
        });
        preloader.classList.add('done');
        setTimeout(engine.start, 300);
      });
    } else {
      SLIDES.forEach(function(slide, i) {
        getPalette(slide.querySelector('img.fg'), i);
      });
      preloader.classList.add('done');
      setTimeout(engine.start, 300);
    }
  });

  /* Timer that cannot get stuck: always schedules itself again */
  var order = [];
  var idx = -1;
  var lastIdx = -1;
  var currentTimer = null;
  var tintTimer = null;

  function shuffle() {
    for (var i = 0; i < TOTAL; i++) order[i] = i;
    for (var i = TOTAL - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = order[i]; order[i] = order[j]; order[j] = t;
    }
    /* Don't start with the same visual as the last end of previous cycle */
    if (lastIdx !== -1 && order.length > 1 && order[0] === lastIdx) {
      var k = order[1]; order[1] = order[0]; order[0] = k;
    }
  }

  function applyKB(el, announce) {
    el.style.animation = 'none';
    void el.offsetWidth;
    var kb = KBS[Math.floor(Math.random() * KBS.length)];
    var dur = 13 + Math.random() * 7;
    el.style.animation = kb + ' ' + dur + 's ease-in-out both';
  }

  function setDots(activeIdx, prevIdx) {
    Array.prototype.forEach.call(dotsBox.children, function(dot, i) {
      dot.classList.remove('on');
      if (i === activeIdx) dot.classList.add('on');
    });
  }

  function runProgress(ms) {
    progress.style.transition = 'none';
    progress.style.width = '0%';
    void progress.offsetWidth;
    progress.style.transition = 'width ' + ms + 'ms linear';
    progress.style.width = '100%';
  }

  var engine = {
    start: function() {
      shuffle();
      idx = 0;
      SLIDES.forEach(function(s, i) {
        s.classList.remove('active', 'exiting');
        if (i === order[0]) s.classList.add('active');
      });
      applyKB(SLIDES[order[0]].querySelector('.kb'));
      setDots(order[0]);
      tilt.current = SLIDES[order[0]].querySelector('.tilt3d');
      engine.schedule();
    },
    isRunning: true,
    schedule: function() {
      clearTimeout(currentTimer);
      var delay = 5000 + Math.random() * 4000;
      runProgress(delay);
      currentTimer = setTimeout(function() {
        engine.next();
        engine.schedule();
      }, delay + 300);
    },
    next: function() {
      var prev = order[idx];
      idx++;
      if (idx >= TOTAL) {
        shuffle();
        idx = 0;
      }
      var next = order[idx];
      lastIdx = prev;

      var prevEl = SLIDES[prev];
      var nextEl = SLIDES[next];

      /* Ken Burns on the incoming art */
      var kb = nextEl.querySelector('.kb');
      applyKB(kb);

      /* Colour-matched crossfade: wash the screen with the incoming image's dominant colour */
      flush.style.opacity = '0';
      flush.style.backgroundColor = 'rgb(' + (palettes[next] || '0,0,0') + ')';
      void flush.offsetWidth;
      flush.style.opacity = '0.28';
      clearTimeout(tintTimer);
      tintTimer = setTimeout(function() {
        flush.style.opacity = '0';
      }, 300);

      /* Blur-dissolve in: jump the incoming slide to blurred, then sharpen into focus */
      nextEl.style.transition = 'none';
      nextEl.classList.remove('exiting');
      nextEl.classList.add('entering');
      nextEl.classList.add('active');
      void nextEl.offsetWidth;
      nextEl.style.transition = '';
      void nextEl.offsetWidth;
      nextEl.classList.remove('entering');

      /* Outgoing softens away */
      prevEl.classList.remove('active');
      prevEl.classList.add('exiting');
      setTimeout(function() {
        prevEl.classList.remove('exiting');
      }, 1500);

      tilt.current = nextEl.querySelector('.tilt3d');
      setDots(next);
    },
    skip: function() {
      clearTimeout(currentTimer);
      engine.next();
      engine.schedule();
    }
  };

  /* ============ 3D TILT (spring physics, delta-time, input-filtered) ============ */
  var tilt = {
    current: null,
    x: 0, y: 0, vx: 0, vy: 0,
    rawX: 0, rawY: 0,
    tx: 0, ty: 0,
    last: null,
    raf: null,
    reduced: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches,

    input: function(rx, ry) {
      rx = Math.max(-9, Math.min(9, rx));
      ry = Math.max(-9, Math.min(9, ry));
      /* deadzone: ignore micro jitter from hand shake / sensor noise */
      if (Math.abs(rx) < 0.35) rx = 0;
      if (Math.abs(ry) < 0.35) ry = 0;
      this.rawX = rx;
      this.rawY = ry;
    },
    idle: function() {
      this.rawX = 0;
      this.rawY = 0;
    },

    loop: function(now) {
      if (this.last === null) this.last = now;
      var dt = (now - this.last) / 1000;
      this.last = now;
      if (dt > 0.064) dt = 0.064;
      if (dt <= 0) dt = 0.016;

      /* low-pass the smoothed target so raw input feels silky */
      var lf = dt * 12;
      if (lf > 1) lf = 1;
      this.tx += (this.rawX - this.tx) * lf;
      this.ty += (this.rawY - this.ty) * lf;

      /* critically-damped spring: no jitter, no overshoot, gentle float */
      var omega = 4.0;
      var damp = 1.05;
      var vmax = 14;

      this.vx += ((this.tx - this.x) * omega * omega - 2 * damp * omega * this.vx) * dt;
      this.vy += ((this.ty - this.y) * omega * omega - 2 * damp * omega * this.vy) * dt;
      if (this.vx > vmax) this.vx = vmax; if (this.vx < -vmax) this.vx = -vmax;
      if (this.vy > vmax) this.vy = vmax; if (this.vy < -vmax) this.vy = -vmax;
      this.x += this.vx * dt;
      this.y += this.vy * dt;

      /* settle exactly when fully at rest */
      if (Math.abs(this.tx - this.x) < 0.012 && Math.abs(this.vx) < 0.02) { this.x = this.tx; this.vx = 0; }
      if (Math.abs(this.ty - this.y) < 0.012 && Math.abs(this.vy) < 0.02) { this.y = this.ty; this.vy = 0; }

      if (this.current) {
        var ptx = -this.y * 2.6;
        var pty = this.x * 2.6;
        this.current.style.transform =
          'perspective(1200px) translate3d(' + ptx.toFixed(2) + 'px,' + pty.toFixed(2) + 'px,0) ' +
          'rotateX(' + this.x.toFixed(3) + 'deg) rotateY(' + this.y.toFixed(3) + 'deg) scale(1.06)';
      }
      this.raf = requestAnimationFrame(this.loop.bind(this));
    },
    start: function() {
      this.raf = requestAnimationFrame(this.loop.bind(this));
    }
  };

  if (!tilt.reduced) {
    tilt.start();

    /* Desktop / fine pointer */
    if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
      document.addEventListener('mousemove', function(e) {
        var nx = e.clientX / window.innerWidth - 0.5;
        var ny = e.clientY / window.innerHeight - 0.5;
        document.body.classList.add('tilt-hover');
        tilt.input(-ny * 12, nx * 16);
      });
      document.addEventListener('mouseleave', function() {
        document.body.classList.remove('tilt-hover');
        tilt.idle();
      });
    }

    /* Phone gyroscope */
    function bindGyro() {
      window.addEventListener('deviceorientation', function(e) {
        if (e.beta === null || e.gamma === null) return;
        var g = e.gamma;
        var b = e.beta - (window.innerHeight > window.innerWidth ? 45 : 30);
        if (Math.abs(b) > 60) return;
        tilt.input(b * 0.45, g * 0.45);
      }, { passive: true });
    }

    function requestGyro() {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(function(state) {
            if (state === 'granted') bindGyro();
          }).catch(function() {});
        } else if (typeof window.DeviceOrientationEvent !== 'undefined') {
          bindGyro();
        }
      } catch (err) {}
    }

    /* Ask for gyro on the first interaction (iOS requirement) */
    var gyroAsked = false;
    function tryGyro() {
      if (gyroAsked) return;
      gyroAsked = true;
      requestGyro();
      window.removeEventListener('touchstart', tryGyro);
      window.removeEventListener('click', tryGyro);
    }
    window.addEventListener('touchstart', tryGyro, { passive: true });
    window.addEventListener('click', tryGyro);
  }

  tapZone.addEventListener('click', engine.skip);
  tapZone.addEventListener('touchend', function(e) {
    e.preventDefault();
    engine.skip();
  });
})();
</script>
</body>
</html>
